spring.application.name=coderoute-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:coderoute;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

analytics.service.url=${ANALYTICS_SERVICE_URL:http://127.0.0.1:8000}
analytics.service.token=${ANALYTICS_SERVICE_TOKEN:}

app.cors.allowed-origin-patterns=${FRONTEND_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.jwt.secret=${JWT_SECRET:dev-local-secret-key-that-is-long-enough-for-jwt}
app.jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}
